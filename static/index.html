<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>住房贷款纾困申请与履约跟踪</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #17212b; }
    main { max-width: 960px; margin: auto; }
    button { padding: .55rem .9rem; cursor: pointer; }
    input, select { padding: .45rem .6rem; }
    pre { background: #f4f6f8; padding: 1rem; overflow: auto; border-radius: 8px; }
    .row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin-bottom: .8rem; }
    fieldset { border: 1px solid #d5dce3; border-radius: 8px; margin-bottom: 1rem; }
    legend { font-weight: 600; }
  </style>
</head>
<body>
<main>
  <h1>住房贷款纾困申请与履约跟踪</h1>
  <p>记录按分行隔离：列表、详情、统计与动作仅覆盖当前分行。管理员可发起转办，目标分行确认后归属与待办切换。</p>
  <fieldset>
    <legend>当前身份</legend>
    <div class="row">
      <label>分行 <input id="org" value="branch-a"></label>
      <label>角色
        <select id="role">
          <option value="admin">admin</option>
          <option value="intake_officer">intake_officer</option>
          <option value="underwriter">underwriter</option>
          <option value="servicer">servicer</option>
        </select>
      </label>
      <span>用户固定为 demo-user，切换分行即可看到各自归属的记录。</span>
    </div>
  </fieldset>
  <fieldset>
    <legend>本分行视图</legend>
    <div class="row">
      <button id="load">加载本分行记录</button>
      <button id="stats">状态统计</button>
      <button id="incoming">转入待办</button>
      <button id="outgoing">转出记录</button>
    </div>
    <div class="row">
      <input id="rid" placeholder="记录ID" size="8">
      <button id="detail">查看归属与转办历史</button>
    </div>
  </fieldset>
  <fieldset>
    <legend>转办（需 admin 角色）</legend>
    <div class="row">
      <input id="tRecord" placeholder="记录ID" size="8">
      <input id="tOrg" placeholder="目标分行" size="12">
      <input id="tReason" placeholder="转办原因" size="24">
      <button id="initiate">发起转办</button>
    </div>
    <div class="row">
      <input id="tId" placeholder="转办单ID" size="8">
      <button id="confirm">确认转入（目标分行）</button>
    </div>
  </fieldset>
  <pre id="output">点击上方按钮读取服务状态。</pre>
</main>
<script>
function headers() {
  return {
    "X-User-Id": "demo-user",
    "X-Role": document.getElementById("role").value,
    "X-Org": document.getElementById("org").value.trim()
  };
}
async function show(path, options) {
  const response = await fetch(path, Object.assign({headers: headers()}, options || {}));
  const data = await response.json();
  document.getElementById("output").textContent = JSON.stringify(data, null, 2);
}
function post(path, body) {
  return show(path, {method: "POST", headers: Object.assign(headers(), {"Content-Type": "application/json"}), body: JSON.stringify(body || {})});
}
document.getElementById("load").onclick = () => show("/api/records?limit=20");
document.getElementById("stats").onclick = () => show("/api/stats");
document.getElementById("incoming").onclick = () => show("/api/transfers/incoming");
document.getElementById("outgoing").onclick = () => show("/api/transfers/outgoing");
document.getElementById("detail").onclick = async () => {
  const id = document.getElementById("rid").value.trim();
  const record = await (await fetch("/api/records/" + id, {headers: headers()})).json();
  const transfers = await (await fetch("/api/records/" + id + "/transfers", {headers: headers()})).json();
  document.getElementById("output").textContent = JSON.stringify({record, transfers}, null, 2);
};
document.getElementById("initiate").onclick = () => post(
  "/api/records/" + document.getElementById("tRecord").value.trim() + "/transfer",
  {to_org: document.getElementById("tOrg").value.trim(), reason: document.getElementById("tReason").value.trim()}
);
document.getElementById("confirm").onclick = () => post("/api/transfers/" + document.getElementById("tId").value.trim() + "/confirm", {});
</script>
</body>
</html>
