<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>住房贷款纾困申请与履约跟踪</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #17212b; }
    main { max-width: 960px; margin: auto; }
    button { padding: .55rem .9rem; cursor: pointer; }
    input { padding: .45rem .6rem; }
    pre { background: #f4f6f8; padding: 1rem; overflow: auto; border-radius: 8px; }
    .row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; margin-bottom: .75rem; }
    fieldset { border: 1px solid #d4dbe3; border-radius: 8px; margin-bottom: 1rem; }
    legend { font-weight: 600; }
  </style>
</head>
<body>
<main>
  <h1>住房贷款纾困申请与履约跟踪</h1>
  <p>数据按分行隔离：列表、详情、统计与动作仅覆盖当前分行；管理员可发起转办，目标分行管理员确认后归属与待办切换。</p>
  <fieldset>
    <legend>身份</legend>
    <div class="row">
      <label>用户 <input id="user" value="demo-admin"></label>
      <label>角色 <input id="role" value="admin"></label>
      <label>分行 <input id="org" value="branch-a"></label>
    </div>
  </fieldset>
  <fieldset>
    <legend>本分行视图</legend>
    <div class="row">
      <button id="load">加载本分行记录</button>
      <button id="stats">状态统计</button>
      <button id="incoming">待确认转入</button>
    </div>
  </fieldset>
  <fieldset>
    <legend>个案</legend>
    <div class="row">
      <input id="recordId" placeholder="记录ID" size="8">
      <button id="detail">查看详情与归属</button>
      <button id="transfers">转办记录</button>
    </div>
    <div class="row">
      <input id="toBranch" placeholder="目标分行" size="12">
      <input id="reason" placeholder="转办原因" size="24">
      <button id="initiate">发起转办</button>
    </div>
    <div class="row">
      <input id="transferId" placeholder="转办ID" size="8">
      <button id="confirm">确认转入</button>
    </div>
  </fieldset>
  <pre id="output">点击上方按钮读取服务状态。</pre>
</main>
<script>
function headers() {
  return {
    "X-User-Id": document.getElementById("user").value,
    "X-Role": document.getElementById("role").value,
    "X-Org": document.getElementById("org").value,
    "Content-Type": "application/json"
  };
}
async function show(path, options) {
  const response = await fetch(path, Object.assign({headers: headers()}, options || {}));
  const data = await response.json();
  document.getElementById("output").textContent = JSON.stringify(data, null, 2);
}
function recordId() { return document.getElementById("recordId").value.trim(); }
document.getElementById("load").onclick = () => show("/api/records?limit=20");
document.getElementById("stats").onclick = () => show("/api/stats");
document.getElementById("incoming").onclick = () => show("/api/transfers/incoming");
document.getElementById("detail").onclick = () => show("/api/records/" + recordId());
document.getElementById("transfers").onclick = () => show("/api/records/" + recordId() + "/transfers");
document.getElementById("initiate").onclick = () => show("/api/records/" + recordId() + "/transfers", {
  method: "POST",
  body: JSON.stringify({to_branch: document.getElementById("toBranch").value, reason: document.getElementById("reason").value})
});
document.getElementById("confirm").onclick = () => show("/api/transfers/" + document.getElementById("transferId").value.trim() + "/confirm", {method: "POST", body: "{}"});
</script>
</body>
</html>
